# Model hyperparameters (P3, plan F2). Fixed a priori; nothing here was tuned on test data.
# Decisions: docs/DECISIONS.md K-027 ... K-031. The only tuning step allowed in P3 is the one-off LSTM
# autoencoder retry on the VALIDATION ROC-AUC (K-030), recorded as a separate entry below if used.

runtime:            # not part of the run id; recorded in run_config.json (K-031)
  device: cuda      # deep models and XGBoost
  threads: 4        # CPU threads for torch, sklearn, XGBoost and data preparation; override with --threads

common:             # deep models
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 0.0
  max_epochs: 30
  patience: 5       # early stopping on validation loss
  eval_batch_size: 2048

models:
  cnn1d:            # supervised 1D-CNN window classifier (M1)
    family: supervised_deep
    channels: [32, 64, 64]
    kernels: [5, 5, 3]
    hidden: 32
    dropout: 0.2
    pos_weight: auto            # N_neg / N_pos of the training windows (K-027)
    decision_threshold: 0.5     # fixed, not tuned (K-027)

  lstm_ae:          # unsupervised LSTM autoencoder (M2), trained on normal_subset windows only (K-022)
    family: autoencoder
    hidden: 64
    latent: 32
    batch_size: 256
    threshold_percentile: 99.0  # of the training (normal subset) score distribution (K-030)

  conv_ae:          # fallback (M2-alt): written, trained only if lstm_ae fails the validation check
    family: autoencoder
    channels: [32, 64]
    latent_channels: 16
    batch_size: 256
    threshold_percentile: 99.0

  rf:               # classical reference (M0) on window summary features
    family: classical
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 1
    class_weight: balanced      # K-027
    decision_threshold: 0.5

  xgb:
    family: classical
    n_estimators: 1000
    max_depth: 6
    learning_rate: 0.1
    subsample: 1.0
    colsample_bytree: 1.0
    early_stopping_rounds: 20   # on validation logloss
    scale_pos_weight: auto      # N_neg / N_pos of the training windows (K-027)
    decision_threshold: 0.5

# Feasibility decision for the unsupervised model (K-030): validation ROC-AUC per dataset, primary pool.
ae_feasibility:
  min_val_roc_auc: 0.6
  retry:            # applied once if lstm_ae is below the bar on any dataset
    hidden: 128
    lr: 3.0e-4
    max_epochs: 60
